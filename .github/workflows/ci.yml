name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Rust and Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python experiment dependencies
        run: python -m pip install -r experiments/requirements.txt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check

      - name: Run Clippy
        working-directory: backend
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: backend
        run: cargo test --workspace

      - name: Run Python tests
        working-directory: experiments
        run: python -m pytest

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check dependency policy
        working-directory: backend
        run: cargo deny check
